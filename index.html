const labelEls = LABELS.map(L=>{
  const el=document.createElementNS(SVGNS,'text');
  el.setAttribute('class', L.cls); el.textContent=L.text;
  document.getElementById('labels').appendChild(el);
  return el;
});
let guideOn = false, repsOn = 0, coachOn = false, ballsOn = false;
const camFigs = ph=>ph.focus ? ph.focus.map(i=>figs[i]) : shown();

// ── Per-frame body ──
// Staged change of pose: legs lead, the torso follows, arms last — and the two legs don't move in
// unison — so getting down or standing up reads as a person, not a blend.
// Offsets (fraction of the change) per pose slot: lift, lean, roll | legL | legR | armL | armR | toes | anchor | neck | twist
const STAGE = [.12,.18,.12, 0,0,0, .22,.22,.22, .3,.3,.3, .34,.34,.34, .1,.1, 0, .25, .25];
const stagedMix = (a, b, k)=>a.map((v,i)=>{ const o=STAGE[i]||0; return mix(v, b[i], ease(clamp((k-o)/(1-o), 0, 1))); });
// Walking, jogging, turning and standing: the engine gait — planted feet move back under the body at its
// own speed, so they never slide; turning on the spot, the feet step round with the body.
// Starting and stopping (below ~0.6 m/s) the engine gait takes shorter, slower steps and a planted foot
// drifts back slower than the body moves: feed it the speed whose steps carry the feet back at the body's
// real speed, so the short walks between exercise spots don't skate.
const gaitG = x=>x*sstep(.08, .6, x);
function stepSpeed(sp){ if(sp>=.6 || sp<=0) return sp; let lo=sp, hi=.6; for(let k=0;k<14;k++){ const m=(lo+hi)/2; if(gaitG(m)<sp) lo=m; else hi=m; } return hi; }
function gaitPose(f, t, dt){
  const s=Math.sin(f.yaw), c=Math.cos(f.yaw), sp=Math.hypot(f.vx, f.vz), n=sp||1;
  const lx=(f.vx*c - f.vz*s)/n, lz=(f.vx*s + f.vz*c)/n;
  // turning on the spot the feet step round with the body (stepIn); one continuous blend between stepping
  // round and walking off, so the feet never jump from one to the other
  const stepIn = sp<.6 ? Math.min(1.1, (f.turnV||0)*.45) : 0;
  const sT = Math.max(stepSpeed(sp), stepIn), w = sT>0 ? Math.min(1, sp/Math.max(1e-6, gaitG(sT))) : 0;
  const q = gaitQ(f, lx*w, lz*w, sT, dt, t), back=Math.max(0, -lz)*sstep(.3,1,sp);
  if(back>0){ q[15]=Math.max(q[15], .55*back); q[16]=Math.max(q[16], .55*back); }   // backwards: up on the toes
  return Q20(q);
}
// f.mv: a walk to the next exercise spot — ~0.6 s to get going, steady, ~0.6 s to stop
function walkAt(m, t){
  const k=clamp((t-m.t0)/m.dur, 0, 1), p=Math.min(.45, .6/m.dur), v=1/(1-p);
  const e = k<p ? v*k*k/(2*p) : k<1-p ? v*(k-p/2) : 1 - v*(1-k)*(1-k)/(2*p);
  return [mix(m.from[0], m.to[0], e), mix(m.from[1], m.to[1], e)];
}
function wuUpdate(f, t, dt){
  let nx=f.x, nz=f.z, exR=null;
  f.rollRot=null; f.customJ=null;
  // a walk starts once the player has settled out of the exercise into the standing stance and, for a
  // longer walk, turned towards it (the start waits until the body faces the way to go)
  if(f.mv && !f.mv.on){ const wd=Math.atan2(f.mv.to[0]-f.mv.from[0], f.mv.to[1]-f.mv.from[1]);
    const ready = f.mode==='gait' && f.tw>=1 && !(f.mv.turn && Math.abs(wrap(wd-f.yaw))>.45);
    if(!ready) f.mv.t0=Math.max(f.mv.t0, t); else f.mv.on=true; }
  const walking = f.mv && t<f.mv.t0+f.mv.dur;
  if(f.mv) [nx, nz] = walkAt(f.mv, t);
  if(f.ex && !f.ex.walk){
    // Exercise script: EX[name].state sets position, pose and contacts
    const S=f.ex, E=EX[S.name];
    // S.stop (phase stopAt): the script holds at that point until a later phase moves it on
    const cap = S.stop!=null && S.prog <= S.stop + S.lag + 1e-6 ? S.stop + S.lag : E.END + S.lag + .5;
    if(t>=S.t0) S.prog = Math.min(S.prog + dt*S.speed, cap);
    exR = E.state(S, Math.max(0, S.prog - S.lag), f);
    if(exR.x!=null) nx=exR.x;
    if(exR.z!=null) nz=exR.z;
    if(exR.face!=null) f.face=exR.face;
    f.rollRot=exR.rot||null; f.plant=exR.plant||0; f.pinW=exR.pinW||null; f.armW=exR.armW||null;
    f.handT=exR.handT||null; f.sup=exR.sup||null; f.grip=exR.grip||null; f.customJ=exR.J||null;
    if('ballW' in exR) f.ballW=exR.ballW;
  } else if(f.ex || walking){ f.plant=0; f.pinW=null; f.handT=null; f.sup=null; f.grip=null; f.armW=null; }
  const vx=(nx-f.x)/dt, vz=(nz-f.z)/dt, kv=Math.min(1, dt*12);
  f.x=nx; f.z=nz; f.vx=mix(f.vx, vx, kv); f.vz=mix(f.vz, vz, kv);
  const sp=Math.hypot(f.vx, f.vz);
  // facing: along a longer walk, then round to the exercise's facing; never while on the knees
  const ty = f.mv && f.mv.turn && (walking || t<f.mv.t0) && (f.mv.on || (f.mode==='gait' && f.tw>=1)) ? Math.atan2(f.mv.to[0]-f.mv.from[0], f.mv.to[1]-f.mv.from[1]) : f.face;
  const kn=1-clamp(f.q[17]||0, 0, 1), TR=(walking ? 3 : 2)*f.pace;   // turn rate cap (rad/s): the feet step round, they don't skid
  const dy=exR && exR.yaw!=null ? wrap(exR.yaw-f.yaw) : clamp(wrap(ty-f.yaw)*Math.min(1, dt*(walking ? 7 : 4.5)*kn*kn), -TR*dt, TR*dt);
  f.yaw += dy; f.turnV = dt>0 ? mix(f.turnV||0, Math.abs(dy)/dt, Math.min(1, dt*10)) : 0;
  f.headTurn += (f.headTarget-f.headTurn)*Math.min(1, dt*8);
  // walked in and turned to face the right way: the exercise (or partner game) starts
  if(f.ex && f.ex.walk && !walking && sp<.25 && Math.abs(wrap(f.ex.face0-f.yaw))<.1){ f.ex.walk=false; f.ex.t0=Math.max(f.ex.t0, t); f.mv=null; }
  const gameOn = f.poseFn && !walking && sp<.25 && Math.abs(wrap(f.face-f.yaw))<.1;
  if(f.mv && !walking && !f.ex) f.mv=null;

  let target, mode;
  if(exR && exR.q){ target=Q20(exR.q); mode='ex'; }
  else if(gameOn){ if(!f.fnOn){ f.fnOn=true; const G=f.thr||f.pb; if(G) G.t0=Math.max(G.t0, t); } target=Q20(f.poseFn(f, t, dt)); mode='fn'; }
  else { target=gaitPose(f, t, dt); mode='gait'; }
  // ball held in both hands in front of the body the whole time
  if(f.holdBall){ target=target.slice(); const A=[.5, -.18, 1.15]; for(let i=0;i<3;i++){ target[9+i]=A[i]; target[12+i]=A[i]; } }
  // ball balanced on one outstretched hand (arm out to the side, palm up), a small wobble while it balances
  if(f.oneHand!=null){ target=target.slice(); const k=f.oneHand, wob=.04*Math.sin(t*5.3+k);
    target[9+k*3]=.65+wob; target[10+k*3]=1.15-wob; target[11+k*3]=.25; }

  if(mode!==f.mode){ f.qFrom=f.q.slice(); f.tw=0; f.mode=mode; f.twDur=(f.rate ? 3/f.rate : .45)*f.pace; }
  // the exercise scripts and partner games keep their own follow rate (keeps up when fast-forwarded)
  const r = mode==='ex' ? 1-Math.exp(-dt*(EX[f.ex.name].rate||30)*Math.max(1, f.ex.speed))
          : mode==='fn' ? 1-Math.exp(-dt*(f.thr && f.thr.go ? 24*f.thr.speed : f.pb ? 20*f.pb.speed : f.rate||16)) : 1;
  if(f.tw<1){
    const sp2 = mode==='ex' ? Math.max(1, f.ex.speed) : 1;
    f.tw=Math.min(1, f.tw+dt*sp2/f.twDur);
    f.q=stagedMix(f.qFrom, target, f.tw);
    if(f.tw>=1) f.qS=f.q.slice();
  } else if(r<1){ for(let i=0;i<f.q.length;i++) f.q[i] += (target[i]-f.q[i])*r; }
  else f.q=target;
  f.lift=f.q[0];
}
function snapFigW(f){ f.vx=f.vz=0; f.turnV=0; f.mode='gait'; f.tw=1; f.q=gaitPose(f, 0, 0); }

function applyScene(idx, t, snap){
  const ph=phases[idx];
  guideOn = ph.guide||false;
  coachOn = !!PARTS[ph.part].coach;
  if(coachOn){ const at=PARTS[ph.part].coachAt||[0, COACH_Z]; coach.x=at[0]; coach.z=at[1]; coach.mv=null; }   // coach's spot for this part
  ballsOn = !!ph.ball;
  document.getElementById('ff').textContent = `⏩ ${ph.speed||3}× speed`;
  cam.follow.fixX = ph.focus ? null : 0;   // focus: centre the camera on those players
  const lab=document.getElementById('labels');
  if(ph.labels) retrigger(lab,'show'); else lab.classList.remove('show');
  document.getElementById('ff').classList.toggle('show', !!ph.ff);
  document.getElementById('reps').classList.toggle('show', !!ph.reps);
  repsOn = ph.reps||0;
  cam.follow.headingTarget = ph.view;
  cam.follow.target = { ...FOLLOW, ...(ph.follow||{}) };
  cam.blendTarget = ph.cam==='follow' ? 1 : 0;
  let walkT = 0;   // longest walk to a new exercise spot this phase (added to the phase's time)
  figs.forEach((f,i)=>{
    // players beyond this part's count stand aside, hidden, until a part needs them
    f.hidden = i>=partPlayers(ph);
    if(f.hidden){ f.mv=null; f.ex=null; f.handT=null; f.sup=null; f.grip=null; f.thr=null; f.pb=null; f.poseFn=null; f.plant=0; return; }
    f.holdBall = !!ph.holdBall;   // ball held in both hands
    f.oneHand = ph.oneHand ?? null;   // ball balanced on one hand (1 = right, 0 = left)
    const s = { x:(ph.xs||START)[i], z:ph.zs ? ph.zs[i] : ph.z, face:ph.faces ? ph.faces[i] : ph.face, idle:ph.idle };
    // ex + keep: the exercise script carries on (speed can change; go:true starts a waiting script)
    if(!snap && ph.ex && ph.keep && f.ex && f.ex.name===ph.ex){ f.ex.speed=ph.speed??1; f.ex.stop=ph.stopAt??null; if(ph.go && !f.ex.go){ f.ex.go=true; f.ex.goT=f.ex.prog; } return; }
    // partner games on the same leg carry on; go:true starts one that's waiting
    if(!snap && ph.pb && f.pb && f.pb.st===ph.pb.st){ if(ph.pb.go && !f.pb.go){ f.pb.go=true; f.pb.t0=t+(ph.delay||0); } f.pb.speed=ph.speed||1; return; }
    if(!snap && ph.thr && f.thr && f.thr.st===ph.thr.st){ if(ph.thr.go && !f.thr.go){ f.thr.go=true; f.thr.t0=t+(ph.delay||0); } f.thr.speed=ph.speed||1; return; }
    f.face=s.face; f.idle=s.idle; f.rate=ph.rate; f.idleSpeed=1; f.fnOn=false;
    f.thr = ph.thr && !snap ? { st:ph.thr.st, isA:i%2===0, go:!!ph.thr.go, t0:t+(ph.delay||0), speed:ph.speed||1, prog:THR.AR, ph:i*1.7 } : null;
    if(ph.pb && !snap){   // each player's spot and the direction to the partner
      const j=i^1, ox=(ph.xs)[j]-s.x, oz=(ph.zs ? ph.zs[j] : ph.z)-s.z, L=Math.hypot(ox,oz)||1;
      f.pb={ st:ph.pb.st, isA:i%2===0, go:!!ph.pb.go, palms:!!ph.pb.palms, t0:t+(ph.delay||0), speed:ph.speed||1, prog:0, x0:s.x, z0:s.z, u:[ox/L, oz/L], ph:i*1.3 };
    } else f.pb=null;
    f.poseFn = f.thr ? thrPose : f.pb ? pbPose : null;
    f.ex=null; f.handT=null; f.sup=null; f.grip=null; f.plant=0; f.pinW=null; f.armW=null; f.around=null; f.customJ=null;
    f.ballW = null;
    if(snap){ f.x=s.x; f.z=s.z; f.mv=null; f.yaw=s.face; }
    // a new spot: walk there (turning to walk if it's more than a step or two away), then turn to face
    const d=Math.hypot(s.x-f.x, s.z-f.z);
    if(!snap && d>.06 && !(ph.keep && f.mv && f.mv.to[0]===s.x && f.mv.to[1]===s.z)){
      const dur=ph.dur||Math.max(.9, d/1.25 + .4), turn=d>1.2;
      f.mv={ from:[f.x,f.z], to:[s.x,s.z], t0:t+(ph.delay||0)+i*.06, dur, turn };
      walkT=Math.max(walkT, (ph.delay||0)+i*.06+dur+(turn || Math.abs(wrap(s.face-f.yaw))>.3 ? 1.25 : .7));   // + settling out of the exercise and turning
    } else if(!snap && !(f.mv && ph.keep)) f.mv=null;
    if(ph.ex){   // the exercise script from the phase's spot, once the player is there and facing the right way
      if(snap) f.q=Q20(pose.stand());
      f.ex={ name:ph.ex, t0:t+(ph.delay||0), prog:0, speed:ph.speed??1, x0:s.x, z0:s.z, face0:s.face, i, lag:(ph.lag??.12)*i, opt:ph.opt||{}, go:!!ph.go, goT:0, walk:!!f.mv, stop:ph.stopAt??null };
      if(snap){ f.mode='ex'; f.tw=1; }
      return;
    }
    if(snap){ f.idleClock=0; snapFigW(f); }
  });
  if(snap){
    cam.follow.heading=ph.view; cam.blend=cam.blendTarget;
    setCam(cam, lookCam(cam.overview), followCam(cam.follow, camFigs(ph), 0, true), cam.blend);
  }
  // fast-forward: run to the end of the exercise from where the players really are (a voiceover
  // that held an earlier step longer has moved the script on)
  if(!snap && ph.ff && ph.ex){
    const fs=shown().filter(f=>f.ex && f.ex.name===ph.ex && !f.ex.walk);
    if(fs.length){ const left=Math.max(...fs.map(f=>EX[ph.ex].END + f.ex.lag - f.ex.prog));
      return Math.max(3, (Math.max(0, left)+.4)/(ph.speed||1) + .6); }
  }
  return (ph.hold ?? (ph.delay||0)+(ph.dur||0)+1.7) + (snap ? 0 : walkT);   // seconds until Auto advances
}

function updateScene(t, dt){
  shown().forEach(f=>wuUpdate(f, t, dt));
  if(coachOn) wuUpdate(coach, t, dt);
  cam.blend += clamp(cam.blendTarget-cam.blend, -dt/1.4, dt/1.4);   // 1.4 s crane up/down
  setCam(cam, lookCam(cam.overview), followCam(cam.follow, camFigs(phases[current]), dt, false), cam.blend);
}

// ── Drawing a player: the engine's figure (same rig, kit and proportions), with the exercise contacts —
//    hands on the hips / a partner / the ground, forearms flat — placed by arm IK. guide 'ex': the
//    exercise's own highlight, always drawn round the body, never through it.
function wuFigureItems(f, items, guide){
  const J=bodyJ(f), s=Math.sin(f.yaw), c=Math.cos(f.yaw), tc=TEAM[f.team];
  const W = b=>worldOf(f, b);
  const push = it=>{ if(it) items.push(it); };
  if(guide==='ex' && f.ex && !f.ex.walk && EX[f.ex.name].guide) EX[f.ex.name].guide(cam, f, J, W, push);
  [0,1].forEach(i=>{
    const hip=W(J['hip'+i]), knee=W(J['knee'+i]), ank=W(J['ank'+i]), toe=W(J['toe'+i]);
    const midT=lerp3(hip,knee,.45), sockTop=lerp3(knee,ank,.4), waist=add3(hip,[0,.03,0]);
    push(segItem(midT, knee, .13, SKIN));
    push(segItem(waist, midT, .19, SHORTS, .04));      // drawn before the shirt, so the shirt covers its top
    push(segItem(knee, sockTop, .115, SKIN));
    push(segItem(sockTop, ank, .12, tc));
    push(segItem(ank, toe, .105, BOOT));
  });
  push(segItem(add3(W(J.hip0),[0,.03,0]), add3(W(J.hip1),[0,.03,0]), .22, SHORTS, .04));
  // Torso reads wide from the front/back, narrow side-on
  const vx=f.x-cam.pos[0], vz=f.z-cam.pos[2], vn=Math.hypot(vx,vz)||1;
  const facing=Math.abs((vx*s+vz*c)/vn);
  push(segItem(W(J.base), W(J.neck), .22+.14*facing, tc, .02));
  [0,1].forEach(i=>{
    const sh=W(J['sh'+i]);
    let el=W(J['el'+i]), ha=W(J['hand'+i]);
    if(f.grip){ const k=i?1:-1; [el,ha]=ikArm(sh, f.grip[i], [c*k, .6, -s*k]); }   // hands on the partner's legs
    else if(f.plant && !(f.pinW && f.pinW[i]===null)){   // hands planted on the ground: world pins (f.pinW) or under the shoulders' plank spot
      const k=i?1:-1, pin=f.pinW ? f.pinW[i] : W([k*.2, .02, .44]);
      [el,ha]=ikArm(sh, lerp3(ha, pin, f.plant), [c*k*.6 - s*.5, .2, -s*k*.6 - c*.5]);   // elbows out and back
    }
    else if(f.armW && f.armW[i]){   // hands on a world target (partner games)
      const k=i?1:-1;
      [el,ha]=ikArm(sh, f.armW[i], [k*.8*c - .3*s, -.4, -k*.8*s - .3*c]);   // elbows out, down and back
    }
    if(f.handT){ const T=f.handT(J, i, W); if(T){ const k=i?1:-1; [el,ha]=ikArm(sh, T, [k*.8*c - .3*s, -.3, -k*.8*s - .3*c]); } }   // hand on a target (hips, partner's shoulder)
    if(f.sup && f.sup.w[i]>0){   // forearm flat on the ground (elbow under the shoulder, hand forward along sup.fwd), blended from a planted hand
      const k=i?1:-1, w=f.sup.w[i], fa=[sh[0]+f.sup.fwd[0]*B.LF, .03, sh[2]+f.sup.fwd[1]*B.LF];
      const hp = f.pinW && f.pinW[i] ? f.pinW[i] : W([k*.2, .02, .44]);
      [el,ha]=ikArm(sh, lerp3(hp, fa, w), lerp3([c*k*.6 - s*.5, .2, -s*k*.6 - c*.5], [0,-1,0], w));
    }
    const sl=lerp3(sh,el,.55);
    push(segItem(sl, el, .085, SKIN));
    push(segItem(sh, sl, .105, tc, -.001));
    push(segItem(el, ha, .08, SKIN));
  });
  const H=W(J.head);
  push(segItem(W(J.neck), H, .09, SKIN, .01));
  // Head: hair at the back, eyes at the front — together they show where the head faces
  const hy=f.yaw+f.headTurn, hs=Math.sin(hy), hc=Math.cos(hy);
  const head=dotItem(H, .12, SKIN, -.01);
  push(head);
  push(dotItem([H[0]-hs*.04, H[1]+.035, H[2]-hc*.04], .112, HAIR, -.005));
  [-1,1].forEach(k=>{
    const eye=dotItem([H[0]+hs*.1+hc*k*.045, H[1]+.01, H[2]+hc*.1-hs*k*.045], .022, '#111', -.03);
    if(eye && head && eye.raw < head.raw && !(f.rollRot && f.rollRot.th>.3 && !f.rollRot.eyes)) items.push(eye);   // face turned away while lying on the side
  });
}

function renderScene(){
  document.getElementById('ground').setAttribute('d', `M0 ${horizonY(cam).toFixed(1)}H360V400H0Z`);
  let st='';
  for(let z=0; z<HALF_Z+40; z+=4) st += polyC(cam, quad(-TOUCH_X, z, TOUCH_X, Math.min(z+2, HALF_Z+40)));
  document.getElementById('stripes').setAttribute('d', st);
  document.getElementById('field').setAttribute('d', FIELD.map(q=>polyC(cam,q)).join(''));
  const AR = PARTS[phases[current].part].area || [-AW, 0, AW, PA_D];   // work area outline (x0, z0, x1, z1)
  document.getElementById('area').setAttribute('d', polyC(cam, quad(AR[0], AR[1], AR[2], AR[3])));
  document.getElementById('areaLine').setAttribute('d',
    lineC(cam,[AR[0],0,AR[1]],[AR[2],0,AR[1]]) + lineC(cam,[AR[2],0,AR[1]],[AR[2],0,AR[3]]) +
    lineC(cam,[AR[2],0,AR[3]],[AR[0],0,AR[3]]) + lineC(cam,[AR[0],0,AR[3]],[AR[0],0,AR[1]]));
  LABELS.forEach((L,i)=>{
    const s=project(cam, L.at), el=labelEls[i];
    if(s[2]<.6 || (L.part && L.part!==phases[current].part)){ el.setAttribute('x',-999); return; }
    el.setAttribute('x', s[0].toFixed(1)); el.setAttribute('y', s[1].toFixed(1));
  });
  callEl.setAttribute('x', -999);

  // Coach's direction: dashed arrow on the ground from each player's spot to the next landing spot
  let dd='', hd='';
  figs.forEach(f=>{
    if(f.hidden || !f.ex || f.ex.walk) return;
    const a=EX[f.ex.name].arrow ? EX[f.ex.name].arrow(f.ex, f) : null; if(!a) return;
    const dx=a[1][0]-a[0][0], dz=a[1][1]-a[0][1], L=Math.hypot(dx,dz), ux=dx/L, uz=dz/L;
    const s=[a[0][0]+ux*.3, 0, a[0][1]+uz*.3], e=[a[1][0]-ux*.35, 0, a[1][1]-uz*.35];
    dd += lineC(cam, s, e);
    hd += polyC(cam, [[e[0]+ux*.3,0,e[2]+uz*.3], [e[0]-uz*.16,0,e[2]+ux*.16], [e[0]+uz*.16,0,e[2]-ux*.16]]);
  });
  document.getElementById('dirs').setAttribute('d', dd);
  document.getElementById('dirHeads').setAttribute('d', hd);

  const items=[];
  (PARTS[phases[current].part].cones || CONES).forEach(c=>{ const it=coneH(cam,c[0],c[1],c[2]); if(it) items.push(it); });
  if(repsOn){
    const f0=figs[0], el=document.getElementById('reps');
    if(f0.ex && EX[f0.ex.name].count) el.textContent=EX[f0.ex.name].count(f0.ex, repsOn);
    else if(f0.pb){   // set timer and points
      const Pb=f0.pb, G=pbState(Math.min(Pb.prog, PB.SET));
      el.textContent=`${Pb.st ? 'Right' : 'Left'} leg · ${clamp(Math.floor(Pb.prog), 0, PB.SET)} / ${PB.SET} s · Points ${G.score[0]}–${G.score[1]}`;
    } else if(f0.thr){   // throw counter: goes up as each catch happens
      const T=f0.thr, n = clamp(Math.floor((T.prog-THR.REL-THR.FLY)/THR.CYC)+1, 0, THR.N);
      el.textContent=`${T.st ? 'Right' : 'Left'} leg · Throw ${n} / ${THR.N}`;
    }
  }

  // Highlight on the player nearest the camera
  let near=null, nd=1e9;
  shown().forEach(f=>{ const d=toCam(cam,[f.x,1,f.z])[2]; if(d<nd){ nd=d; near=f; } });
  figs.forEach((f,i)=>{
    const bs=ballShadows[i];
    if(f.hidden){ shadows[i].setAttribute('rx', 0); bs.setAttribute('rx', 0); return; }
    if(ballsOn && f.oneHand!=null){   // ball sitting on the outstretched palm
      const Jq=fkW(f.q), h=Jq['hand'+f.oneHand], e=Jq['el'+f.oneHand], d=sub3(h,e), L=Math.hypot(...d)||1;
      const p=worldOf(f, [h[0]+d[0]/L*.06, h[1]+.12, h[2]+d[2]/L*.06]);   // on the palm, just past the wrist
      ballItems(cam, p, items); placeShadow(bs, p[0], p[2], .12, Math.max(0, p[1]-.1)*.6);
    }
    else if(ballsOn && f.holdBall){ const p=handsMid(f); ballItems(cam, p, items); placeShadow(bs, p[0], p[2], .12, Math.max(0, p[1]-.1)*.6); }   // ball in both hands
    else if(ballsOn && f.ballW){ ballItems(cam, f.ballW, items); placeShadow(bs, f.ballW[0], f.ballW[2], .12, 0); }   // player's own ball
    else bs.setAttribute('rx', 0);
    wuFigureItems(f, items, guideOn && f===near ? guideOn : false);
    placeShadow(shadows[i], f.x, f.z, .36, f.lift);
  });
  PAIRS.forEach((P,k)=>{
    const A=figs[P.a], el=shadows[figs.length+1+k];
    if(!ballsOn || !A.thr){ el.setAttribute('rx', 0); return; }
    const p=ballPos(P, A, figs[P.b]);
    ballItems(cam, p, items);
    placeShadow(el, p[0], p[2], .12, Math.max(0, p[1]-.1)*.6);
  });
  const cShadow = shadows[figs.length];
  if(coachOn){ wuFigureItems(coach, items, false); placeShadow(cShadow, coach.x, coach.z, .36, coach.lift); }
  else cShadow.setAttribute('rx', 0);
  drawItems(pool, items);
}

// ╔══════════════════════════════════════════════════════════════════╗
// ║  UI                                                              ║
// ╚══════════════════════════════════════════════════════════════════╝
let current=0, isAuto=false, timer=null;
const now = ()=>performance.now()/1000;
// ── Voiceover: the device reads each step aloud (Web Speech API). Auto waits for the sentence to finish ──
// Spoken text = ph.say, else ph.desc; the first step of each part opens with the exercise name.
const VO = { on:false, ok:typeof speechSynthesis!=='undefined' && typeof SpeechSynthesisUtterance!=='undefined', voice:null, done:true, doneAt:0, endAt:0 };
function pickVoice(){   // the most natural English voice the device has
  const vs = VO.ok ? speechSynthesis.getVoices() : [];
  const score = v=>(/premium|enhanced|natural|neural|online/i.test(v.name) ? 4 : 0) +
    (/samantha|ava|allison|aria|jenny|google us english|google uk english female|daniel|serena|karen/i.test(v.name) ? 2 : 0) + (/en[-_]US/i.test(v.lang) ? 1 : 0);
  VO.voice = vs.filter(v=>/^en([-_]|$)/i.test(v.lang)).sort((a,b)=>score(b)-score(a))[0] || null;
}
if(VO.ok){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
// Calm delivery: a little slower than normal speech, one sentence at a time with a short breath between
const VO_RATE = .86, VO_GAP = .55;
function sayText(i){
  const ph=phases[i];
  let s = ph.say ?? ph.desc;
  if(!i || ph.part!==phases[i-1].part) s = `Part ${ph.part}. ${PARTS[ph.part].name.replace(/^E\d+\s*·\s*/, '')}. ${s}`;
  return s.replace(/(\d)\s*–\s*(\d)/g, '$1 to $2').replace(/°/g, ' degrees').replace(/\s*×\s*/g, ' by ')
          .replace(/(\d)v(\d)/g, '$1 v $2').replace(/\s*—\s*/g, ', ');
}
function speak(i){
  if(!VO.on || !VO.ok) return;
  hush(); VO.on=true;
  const text = sayText(i), parts = (text.match(/[^.!?:]+[.!?:]*/g)||[]).map(s=>s.trim()).filter(Boolean);
  const run = {};  VO.run = run;
  VO.done=false; VO.endAt = now() + text.split(/\s+/).length/(2.5*VO_RATE) + parts.length*VO_GAP + 2;   // in case the device never reports the end
  const say = k=>{
    if(VO.run!==run) return;
    if(k>=parts.length){ VO.done=true; VO.doneAt=now(); return; }
    const u = new SpeechSynthesisUtterance(parts[k]);
    if(VO.voice){ u.voice=VO.voice; u.lang=VO.voice.lang; } else u.lang='en-US';
    u.rate=VO_RATE; u.pitch=.98;
    u.onend = u.onerror = ()=>{ if(VO.run===run) VO.gapT=setTimeout(()=>say(k+1), VO_GAP*1000); };
    VO.u=u; speechSynthesis.speak(u);
  };
  say(0);
}
function hush(){ if(VO.ok) speechSynthesis.cancel(); clearTimeout(VO.gapT); VO.run=null; VO.done=true; VO.u=null; }
// still talking (or just finished: a short beat before the next step)
const talking = ()=>VO.on && ((!VO.done && now()<VO.endAt) || now()-VO.doneAt < .9);
function toggleVoice(){
  VO.on=!VO.on;
  const b=document.getElementById('voiceBtn');
  b.classList.toggle('on', VO.on); b.textContent = VO.on ? '🔊 Voiceover: On' : '🔈 Voiceover: Off';
  if(VO.on) speak(current); else hush();
}
if(!VO.ok) document.getElementById('voiceRow').style.display='none';

function retrigger(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

function applyPhase(idx, snap){
  const ph=phases[idx], dur=applyScene(idx, now(), snap);
  const P=PARTS[ph.part], name=document.getElementById('partName');
  if(name.dataset.part!==ph.part){
    name.dataset.part=ph.part;
    document.getElementById('partTitle').textContent=P.title; if(P.sub) document.getElementById('subLine').textContent=P.sub;
    name.innerHTML=`${P.name}<span class="part-time">${P.time}</span>`; retrigger(name,'show');
  }
  const cue=document.getElementById('cue'), card=document.getElementById('card');
  if(ph.cue){ cue.textContent=ph.cue; retrigger(cue,'show'); } else cue.classList.remove('show');
  // card = { k: small red heading, big: main line, sub: detail } — replaces animating repeat sets
  if(ph.card){
    card.innerHTML=`<div class="k">${ph.card.k}</div><div class="big">${ph.card.big}</div><div class="sub">${ph.card.sub}</div>`;
    retrigger(card,'show');
  } else card.classList.remove('show');
  document.getElementById('desc').textContent=ph.desc;
  document.querySelectorAll('.step-dot').forEach((d,i)=>{
    d.classList.toggle('active', i===idx);
    d.classList.toggle('done',   i<idx);
  });
  document.getElementById('prevBtn').style.opacity = idx===0 ? '0.3':'1';
  document.getElementById('nextBtn').style.opacity = idx===phases.length-1 ? '0.3':'1';
  speak(idx);
  return dur;
}

function changePhase(dir){
  const next=clamp(current+dir, 0, phases.length-1);
  if(next!==current){ current=next; applyPhase(current); }
}

// Auto: each phase says how long to wait before the next (cues can change mid-set)
function scheduleNext(wait){
  timer=setTimeout(function go(){
    if(talking()){ timer=setTimeout(go, 150); return; }   // voiceover: let the sentence finish
    if(current<phases.length-1){ current++; scheduleNext(applyPhase(current)); }
    else stopAuto();
  }, Math.max(2600, wait*1000));
}
function toggleAuto(){
  if(isAuto){ stopAuto(); hush(); return; }
  isAuto=true;
  document.getElementById('playBtn').textContent='⏸ Pause';
  if(current===phases.length-1){ current=0; applyPhase(0, true); }
  scheduleNext(0);
}
function stopAuto(){
  isAuto=false; clearTimeout(timer);
  document.getElementById('playBtn').textContent='▶ Auto';
}

let last=now();
function frame(){
  const t=now(), dt=clamp(t-last, 1/240, .05); last=t;
  updateScene(t, dt); renderScene();
  requestAnimationFrame(frame);
}

phases.forEach((ph,i)=>{
  const d=document.createElement('div');
  d.className = 'step-dot' + (i && ph.part!==phases[i-1].part ? ' gap' : '');
  document.getElementById('stepDots').appendChild(d);
});
applyPhase(0, true);
requestAnimationFrame(frame);
</script>
</body>
